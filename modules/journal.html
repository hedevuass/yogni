<div id="load-trigger" style="height: 1px;"></div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
	document.addEventListener("DOMContentLoaded", function () {
		let limit = 3;
		let start = 5; // первые 5 постов уже показаны
		let loading = false;
		let hadError = false; // Флаг «ошибка уже была»
		const path = window.location.pathname.split('/');
		let post_type = path[2] || '';

		// если это idNN *и* есть ещё сегмент path[3], то post_type берём из него
		if (/^id\d+$/.test(post_type) && path[3]) {
			post_type = path[3];
		}

		// Функция, проверяющая, находится ли #load-trigger в зоне [низа экрана – 800px, низа экрана + 200px]
		function checkAndLoadPosts() {
			// Если уже загружаем или произошла ошибка — не пытаемся снова
			if (loading || hadError) return;

			const triggerEl = document.getElementById('load-trigger');
			if (!triggerEl) return;

			const rect = triggerEl.getBoundingClientRect();
			const triggerTop = rect.top;          // px от верхнего края viewport
			const viewportHeight = window.innerHeight;

			// Условие: trigger в зоне [viewportHeight - 800, viewportHeight + 200]
			if (triggerTop <= viewportHeight + 800 && triggerTop >= viewportHeight - 800) {
				loading = true;

				$.ajax({
					url: '/actions/infinitload/load_more_posts.php',
					type: 'POST',
					data: {
						post_type: post_type,
						limit: limit,
						start: start
					},
					dataType: 'json',
					success: function (response) {
						if (response.posts && response.posts.trim() !== '') {
							$('.main-content').append(response.posts);
							start += response.loaded_count; // Увеличиваем start на фактическое количество постов
							hasMorePosts = response.has_more_posts; // Обновляем флаг
							loading = false;
						} else {
							hasMorePosts = false;
							$(window).off('scroll', onScrollHandler);
						}
					},
					error: function () {
						hadError = true;
						$(window).off('scroll', onScrollHandler);
						alert('Ошибка загрузки, проверьте подключение к интернету.');
						loading = false;
					}
				});
			}
		}

		// Обёртка, чтобы можно было снять слушатель
		function onScrollHandler() {
			checkAndLoadPosts();
		}

		// Навешиваем на scroll
		$(window).on('scroll', onScrollHandler);

		// Проверяем один раз после загрузки, если пользователь уже «внизу»
		setTimeout(function () {
			checkAndLoadPosts();
		}, 100);
	});
</script>

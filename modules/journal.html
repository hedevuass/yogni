<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
	$(document).ready(function () {
    let limit = 3;
    let start = 5;
	let post_type = window.location.pathname;
	post_type = post_type.split('/')[2] || '';
    let loading = false;

    $(window).on('scroll', function () {
        if ($(window).scrollTop() + $(window).height() >= $(document).height() - 1600) {
            if (!loading) {
                loading = true;
                /* $('.loading').css('display', 'block'); */

                $.ajax({
                    url: '/modules/load_more_posts.php',
                    type: 'POST',
                    data: {
						post_type: post_type,
                        limit: limit,
                        start: start
                    },
                    dataType: 'json',
                    success: function (response) {
                        setTimeout(function () {
                            /* $('.loading').css('display', 'none'); */
                            if (response.posts) {
                                $('.main-content').append(response.posts);
                                start += limit;
								loading = false;
                            } else {
                                $(window).off('scroll');
                            }
                        }, 100);
                    },
                    error: function () {
                        alert('Произошла ошибка при загрузке постов.');
                        $('.loading').css('display', 'none'); 
                        loading = false; 
                    }
                });
            }
        }
    });
});

</script>
